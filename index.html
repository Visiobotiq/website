<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Visiobotiq - modular software platform for advanced industrial automation." />
  <title>Visiobotiq | Coming soon</title>
  <style>
    :root {
      --navy: #0c2d52;
      --blue: #2675bb;
      --cyan: #43c5e7;
      --ink: #17324b;
      --muted: #60758a;
      --line: #dbe6ee;
      --surface: rgba(255, 255, 255, 0.82);
    }

    * {
      box-sizing: border-box;
    }

    html {
      min-height: 100%;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 32px 20px;
      color: var(--ink);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background:
        radial-gradient(circle at 8% 10%, rgba(67, 197, 231, 0.13), transparent 30%),
        radial-gradient(circle at 92% 90%, rgba(38, 117, 187, 0.12), transparent 32%),
        #f4f8fb;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      z-index: -1;
      pointer-events: none;
      opacity: 0.42;
      background-image:
        linear-gradient(rgba(12, 45, 82, 0.035) 1px, transparent 1px),
        linear-gradient(90deg, rgba(12, 45, 82, 0.035) 1px, transparent 1px);
      background-size: 42px 42px;
    }

    .page {
      width: min(920px, 100%);
      padding: clamp(34px, 7vw, 76px) clamp(24px, 8vw, 92px);
      text-align: center;
      background: var(--surface);
      border: 1px solid rgba(255, 255, 255, 0.9);
      border-radius: 28px;
      box-shadow: 0 24px 70px rgba(20, 61, 95, 0.12);
      backdrop-filter: blur(8px);
    }

    .brand {
      display: block;
      width: min(360px, 78vw);
      height: auto;
      margin: 0 auto 46px;
    }

    .eyebrow {
      display: inline-flex;
      align-items: center;
      gap: 9px;
      margin: 0 0 18px;
      color: var(--blue);
      font-size: 0.78rem;
      font-weight: 800;
      letter-spacing: 0.16em;
      text-transform: uppercase;
    }

    .eyebrow::before,
    .eyebrow::after {
      content: "";
      width: 22px;
      height: 1px;
      background: var(--cyan);
    }

    h1 {
      max-width: 700px;
      margin: 0 auto 18px;
      color: var(--navy);
      font-size: clamp(2.15rem, 5vw, 4rem);
      line-height: 1.04;
      letter-spacing: -0.045em;
    }

    .intro {
      max-width: 610px;
      margin: 0 auto;
      color: var(--muted);
      font-size: clamp(1rem, 2vw, 1.15rem);
      line-height: 1.7;
    }

    .divider {
      width: 100%;
      height: 1px;
      margin: 42px 0 32px;
      background: var(--line);
    }

    .partner-label {
      margin: 0 0 18px;
      color: var(--muted);
      font-size: 0.78rem;
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }

    .esd-logo {
      display: block;
      width: min(150px, 34vw);
      height: auto;
      margin: 0 auto 26px;
    }

    .button {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      padding: 13px 20px;
      color: #fff;
      background: var(--navy);
      border-radius: 999px;
      font-size: 0.92rem;
      font-weight: 700;
      text-decoration: none;
      transition: transform 180ms ease, background 180ms ease, box-shadow 180ms ease;
    }

    .button::after {
      content: "↗";
      color: var(--cyan);
      font-size: 1.1rem;
      line-height: 0;
    }

    .button:hover,
    .button:focus-visible {
      background: var(--blue);
      box-shadow: 0 8px 20px rgba(38, 117, 187, 0.25);
      transform: translateY(-2px);
    }

    .button:focus-visible {
      outline: 3px solid rgba(67, 197, 231, 0.45);
      outline-offset: 4px;
    }

    footer {
      margin-top: 48px;
      color: #91a1af;
      font-size: 0.76rem;
    }

    @media (max-width: 520px) {
      body {
        padding: 16px;
      }

      .page {
        border-radius: 20px;
      }

      .brand {
        margin-bottom: 38px;
      }

      .divider {
        margin: 34px 0 28px;
      }

      footer {
        margin-top: 36px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .button {
        transition: none;
      }
    }
  </style>
</head>
<body>
  <main class="page">
    <img class="brand" src="Assets/visiobotIQ.png" alt="Visiobotiq" />

    <p class="eyebrow">Coming soon</p>
    <h1>Our new website is under construction.</h1>
    <p class="intro">
      Soon you will discover our modular software platform for
      advanced industrial automation.
    </p>

    <div class="divider" aria-hidden="true"></div>

    <p class="partner-label">A product by</p>
    <img class="esd-logo" src="Assets/Logo ESD_RGB.png" alt="E.S.D. Industrial Automation" />
    <a class="button" href="https://www.esdbv.be/" target="_blank" rel="noopener noreferrer">
      Visit the E.S.D. website
    </a>

    <footer>&copy; 2026 Visiobotiq</footer>
  </main>
</body>
</html>
